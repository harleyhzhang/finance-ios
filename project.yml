name: Finance
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Finance.xcconfig
  Release: Config/Finance.xcconfig
targets:
  Finance:
    type: application
    platform: iOS
    sources:
      - path: Finance
        excludes: [snapshot.json]
    info:
      path: Finance/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FINANCE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 9
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
  FinanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FinanceTests]
    dependencies:
      - target: Finance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FINANCE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Finance:
    build:
      targets:
        Finance: all
        FinanceTests: [test]
    test:
      targets: [FinanceTests]
